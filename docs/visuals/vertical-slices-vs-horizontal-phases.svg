<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vertical slices vs horizontal phases in implementation outlines">
<title>Vertical slices vs horizontal phases in implementation outlines</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}.title{font-size:30px;font-weight:700;}.subtitle{font-size:16px;}.ptitle{font-size:21px;font-weight:700;}.psub{font-size:14.5px;}.badge{font-size:11px;font-weight:700;letter-spacing:1px;}.phase{font-size:15px;font-weight:700;}.phasesub{font-size:12.5px;}.bartext{font-size:14.5px;font-weight:600;}.chip{font-size:13.5px;font-weight:700;}.colhead{font-size:13px;font-weight:700;letter-spacing:0.5px;}.note{font-size:14px;}.callout{font-size:19px;font-weight:700;}.calloutsub{font-size:14.5px;}</style>
<rect width="1560" height="756" fill="#ffffff"/>
<text x="64" y="72" class="title" fill="#1f2328">Vertical slices vs horizontal phases</text>
<text x="64" y="104" class="subtitle" fill="#59636e">The shape of an implementation outline decides when you first have something you can run.</text>
<rect x="64" y="144" width="700" height="436" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="614" y="170" width="122" height="24" rx="12" fill="#ffebe9"/><text x="675.0" y="186.5" text-anchor="middle" class="badge" fill="#d1242f">ANTI-PATTERN</text>
<text x="96" y="192" class="ptitle" fill="#1f2328">Horizontal phases</text>
<text x="96" y="220" class="psub" fill="#59636e">Nothing works until everything works.</text>
<text x="96" y="290" class="phase" fill="#1f2328">Phase 1</text>
<rect x="184" y="258" width="330" height="52" rx="8" fill="#57606a"/>
<text x="349" y="290" text-anchor="middle" class="bartext" fill="#f6f8fa">all the DB models</text>
<rect x="538" y="268" width="194" height="32" rx="16" fill="#ffebe9" stroke="#ffcecb"/><text x="635.0" y="289" text-anchor="middle" class="chip" fill="#d1242f">✗ nothing runnable</text>
<text x="96" y="374" class="phase" fill="#1f2328">Phase 2</text>
<rect x="184" y="342" width="330" height="52" rx="8" fill="#57606a"/>
<text x="349" y="374" text-anchor="middle" class="bartext" fill="#f6f8fa">all the APIs</text>
<rect x="538" y="352" width="194" height="32" rx="16" fill="#ffebe9" stroke="#ffcecb"/><text x="635.0" y="373" text-anchor="middle" class="chip" fill="#d1242f">✗ nothing runnable</text>
<text x="96" y="458" class="phase" fill="#1f2328">Phase 3</text>
<rect x="184" y="426" width="330" height="52" rx="8" fill="#57606a"/>
<text x="349" y="458" text-anchor="middle" class="bartext" fill="#f6f8fa">all the UI</text>
<rect x="538" y="436" width="194" height="32" rx="16" fill="#dafbe1" stroke="#aceebb"/><text x="635.0" y="457" text-anchor="middle" class="chip" fill="#1a7f37">✓ finally works</text>
<text x="96" y="556" class="note" fill="#59636e">All feedback and shipping wait for the last phase.</text>
<rect x="796" y="144" width="700" height="436" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="1386" y="170" width="82" height="24" rx="12" fill="#dafbe1"/><text x="1427.0" y="186.5" text-anchor="middle" class="badge" fill="#1a7f37">TARGET</text>
<text x="828" y="192" class="ptitle" fill="#1f2328">Vertical slices</text>
<text x="828" y="220" class="psub" fill="#59636e">Every phase ends runnable, testable, shippable.</text>
<text x="990" y="246" text-anchor="middle" class="colhead" fill="#59636e">DB</text>
<text x="1092" y="246" text-anchor="middle" class="colhead" fill="#59636e">API</text>
<text x="1194" y="246" text-anchor="middle" class="colhead" fill="#59636e">UI</text>
<text x="828" y="278" class="phase" fill="#1f2328">Phase 1</text>
<text x="828" y="297" class="phasesub" fill="#59636e">end-to-end path</text>
<rect x="948" y="258" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1050" y="258" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1152" y="258" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1270" y="268" width="194" height="32" rx="16" fill="#dafbe1" stroke="#aceebb"/><text x="1367.0" y="289" text-anchor="middle" class="chip" fill="#1a7f37">✓ runnable</text>
<text x="828" y="362" class="phase" fill="#1f2328">Phase 2</text>
<text x="828" y="381" class="phasesub" fill="#59636e">next slice</text>
<rect x="948" y="342" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1050" y="342" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1152" y="342" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1270" y="352" width="194" height="32" rx="16" fill="#dafbe1" stroke="#aceebb"/><text x="1367.0" y="373" text-anchor="middle" class="chip" fill="#1a7f37">✓ runnable</text>
<text x="828" y="446" class="phase" fill="#1f2328">Phase 3</text>
<text x="828" y="465" class="phasesub" fill="#59636e">next slice</text>
<rect x="948" y="426" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1050" y="426" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1152" y="426" width="84" height="52" rx="8" fill="#2da44e"/>
<rect x="1270" y="436" width="194" height="32" rx="16" fill="#dafbe1" stroke="#aceebb"/><text x="1367.0" y="457" text-anchor="middle" class="chip" fill="#1a7f37">✓ runnable</text>
<text x="828" y="556" class="note" fill="#59636e">You could ship after any phase.</text>
<rect x="64" y="612" width="1432" height="104" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
<rect x="88" y="636" width="4" height="56" rx="2" fill="#0969da"/>
<text x="112" y="660" class="callout" fill="#1f2328">Fixing the outline costs a sentence; fixing the code costs an afternoon.</text>
<text x="112" y="690" class="calloutsub" fill="#59636e">Rule of thumb: if a phase has nothing meaningful to test on its own, ask for a re-slice.</text>
</svg>
