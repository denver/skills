/* Mouse-following spotlight */
#spotlight {

.text-muted  { color: var(--text-muted); }

.text-gradient {

/* Cards */
.card {

  transition: border-color 0.3s ease, transform 0.2s ease;
}
.card:hover { border-color: var(--border-hover); transform: translateY(-2px); }

/* Metric boxes */
.metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.metric-box {
  background: var(--surface);

  border-radius: 10px;

.metric-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

/* Gradient number variants (stops are shades of the palette tokens) */
.gradient-green  { background: linear-gradient(135deg, #10b981, var(--green) 70%, #6ee7b7); }
.gradient-blue   { background: linear-gradient(135deg, var(--accent-deep), var(--accent) 70%, var(--accent-light)); }
.gradient-violet { background: linear-gradient(135deg, #8b5cf6, var(--violet) 70%, #c4b5fd); }
.gradient-red    { background: linear-gradient(135deg, var(--red), #ef4444); }
.gradient-green, .gradient-blue, .gradient-violet, .gradient-red {

  font-weight: 500;

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th {

td { padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text-muted); }

/* Status color helpers (reference the palette tokens; never restate hex) */

.status-risk    { color: var(--red); }

/* Layout grids */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

/* Kicker: large muted subtitle directly under an h1/h2 */
.kicker { font-size: 1.15rem; color: var(--text-muted); margin-bottom: 20px; }

/* Punch: big standalone statement (thesis or closing punchline) */
.punch {
  font-size: 2rem; font-weight: 700; letter-spacing: -0.02em;

/* Flow/loop row: horizontal process with arrows (pipelines, feedback loops).
   <div class="loop-row">

/* Narrative slide deck — paste into base.html <style>. Pairs with deck.js. */

html {
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  overflow-y: scroll;
}

section {
  min-height: 100vh;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 60px 80px;
}

.section-inner {
  max-width: 1100px;
  width: 100%;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.section-inner.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Fixed top progress bar */
#progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 100%;

  transform-origin: left;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent-light));

}

<script>
document.addEventListener('mousemove', e => {
  document.documentElement.style.setProperty('--x', e.clientX + 'px');
  document.documentElement.style.setProperty('--y', e.clientY + 'px');
});
// Narrative slide deck behavior — paste into base.html <script> (after the spotlight handler).
// Expects <div id="progress"></div>, <div id="dots"></div>, and <section> elements each
// wrapping a .section-inner. Progress bar scales via transform (compositor-only, no layout).

(() => {
  const sections = Array.from(document.querySelectorAll('section'));
  const progress = document.getElementById('progress');
  const dotsWrap = document.getElementById('dots');

  // Build one dot per section
  const dots = sections.map((s, i) => {
    const b = document.createElement('button');
    b.addEventListener('click', () => s.scrollIntoView({ behavior: 'smooth' }));
    dotsWrap.appendChild(b);
    return b;
  });

  // Reveal on scroll + sync progress bar and active dot
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.querySelector('.section-inner')?.classList.add('visible');
      const idx = sections.indexOf(entry.target);
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      progress.style.transform = 'scaleX(' + ((idx + 1) / sections.length) + ')';
    });
  }, { threshold: 0.5 });
  sections.forEach(s => observer.observe(s));

  // Keyboard navigation
  const currentIndex = () =>
    sections.findIndex(s => s.getBoundingClientRect().top >= -window.innerHeight / 2);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      const c = currentIndex();
      if (c !== -1) sections[Math.min(c + 1, sections.length - 1)].scrollIntoView({ behavior: 'smooth' });
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      const c = currentIndex();
      if (c !== -1) sections[Math.max(c - 1, 0)].scrollIntoView({ behavior: 'smooth' });
    }
  });
})();
</script>
